<!doctype html>
<html lang="en">
  <head>
    <title>Bootstrap Example</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Using Bootstrap 5 framework -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery used to load the navbar -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>

  <body>
    <!-- Navbar gets added here -->
    <div id="nav-placeholder"></div>
    <!-- Web page content goes inside Bootstrap container(s) -->

    <div class="container-fluid">
      <h1>I have no clue what ime doing</h1>
      <p>im trying to learn what to do</p>
      <h1>Hello, GitHub! This is my first web page!!</h1>
      <p>
        This is my first web page using version control with Git and GitHub.
      </p>
      <!--added MSU Logo to the webpage-->

      <img
        src="images/msu_logo.jpg"
        class="img-fluid"
        alt="MSU Logo"
        width="200"
        height="200"
      />
    </div>

    <script>
      // Load only the #site-nav element from navbar.html
      $("#nav-placeholder").load("navbar.html #site-nav");
    </script>
  </body>
</html>
